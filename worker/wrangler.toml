# Worker del tauler veïnal (Cloudflare Workers + D1). Ver README.md.
name = "cerdanyola-board"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "cerdanyola-board"
database_id = "c36654a2-da41-4099-8b99-70acc3e18682"

[vars]
ALLOWED_ORIGINS = "https://cerdanyola.horaverda.es,http://localhost:8001"
SITE_URL = "https://cerdanyola.horaverda.es"
FROM_NAME = "Tauler veïnal de Cerdanyola"
# URL pública de este worker (la da `npx wrangler deploy`); la usa el cron para los enlaces de los correos.
API_URL = "https://cerdanyola-board.chatcerdanyola.workers.dev"

[triggers]
crons = ["17 3 * * *"]

# Secretos (npx wrangler secret put NOMBRE):
#   TURNSTILE_SECRET, GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN,
#   GMAIL_FROM, ADMIN_KEY, ADMIN_EMAIL, IP_SALT
